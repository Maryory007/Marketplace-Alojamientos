spring.application.name=marketplace

# ===== Servidor =====
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

# ===== Base de datos (ADR-015/016: secretos por variable de entorno) =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/marketplace}
spring.datasource.username=${DB_USER:marketplace}
spring.datasource.password=${DB_PASSWORD:marketplace}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000

# ===== JPA: el esquema lo manda Flyway, Hibernate solo valida =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# ===== Flyway (ADR-009, ADR-011) =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# ===== JWT (ADR-010) =====
# Minimo 32 bytes para HS256. Generar con: openssl rand -base64 48
app.jwt.secret=${JWT_SECRET:cambia-este-secreto-en-dev-minimo-32-bytes-0123456789}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.jwt.issuer=marketplace

# ===== Recuperacion de contrasena (enlace simulado: no se envia correo real) =====
app.recuperacion.url-base=${RECUPERACION_URL_BASE:http://localhost:5173/restablecer-contrasena}
app.recuperacion.expiracion-minutos=${RECUPERACION_EXPIRACION_MINUTOS:30}
# Solo dev: devuelve el enlace en la respuesta para poder probarlo desde Swagger.
app.recuperacion.exponer-enlace=false

# ===== Swagger / OpenAPI =====
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# ===== CORS (ADR-016) =====
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# ===== Actuator: /health para ADR-005 =====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never



# ===== Logs =====
logging.level.co.edu.unbosque=INFO
logging.pattern.level=%5p [%X{correlationId:-}]
